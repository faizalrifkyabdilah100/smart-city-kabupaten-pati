<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background glow -->
  <defs>
    <radialGradient id="userGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Glow circle -->
  <circle cx="100" cy="100" r="95" fill="url(#userGlow)" stroke="rgba(96, 165, 250, 0.2)" stroke-width="2"/>
  
  <!-- User avatar circle background -->
  <circle cx="100" cy="70" r="35" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  
  <!-- User head -->
  <circle cx="100" cy="65" r="28" fill="#e0e7ff"/>
  
  <!-- User body -->
  <ellipse cx="100" cy="140" rx="40" ry="35" fill="#e0e7ff" stroke="#60a5fa" stroke-width="2"/>
  
  <!-- Shadow/depth -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1"/>
</svg>